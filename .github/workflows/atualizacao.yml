# Fases 4, 5 e 6: atualização automática mensal dos dados e do boletim com IA.
#
# Quatro séries, de três fontes que publicam o mês anterior nos primeiros dias úteis:
# importação de fertilizantes e exportação de soja (Comex Stat/MDIC), preços internacionais
# (Pink Sheet do Banco Mundial) e câmbio (PTAX do BCB, SGS 3698). Um mês só entra quando está
# COMPLETO, gravado nas quatro séries. Entre os dias 1 e 15, o workflow roda uma vez por dia:
#   1. se o mês anterior já está gravado nas quatro séries, não chama nenhuma fonte;
#   2. senão, roda a ingestão incremental das quatro séries (Pink Sheet e PTAX primeiro; o
#      Comex Stat só até o menor mês das duas), o transform e os testes;
#   3. se o último mês completo avançou, ou se o boletim dele ainda não existe, gera o
#      boletim com IA (src/boletim.py);
#   4. commita o que mudou em data/ e boletins/ como github-actions[bot], com a mensagem
#      "chore(dados): atualização AAAA-MM", e publica o dashboard (pages.yml).
# Se alguma fonte ainda não publicou o mês, nada é commitado e o run fica verde, com um aviso
# dizendo qual falta; a partir do dia 15, o job "prazo" fica vermelho dizendo qual. Se uma
# fonte falhar ou não devolver algum mês que diz ter publicado, nada é commitado. Se o
# boletim for reprovado na validação, os dados do mês seguem sem ele.
#
# Privilégios separados por job, sem pull_request_target e sem acesso de PRs ao secret:
#   - "atualizar" roda Python e as dependências de terceiros só com permissão de leitura e
#     entrega data/ como artifact; não vê o secret;
#   - "gerar-boletim" é o ÚNICO job no environment boletim-ia, o único com acesso ao secret:
#     só leitura, não instala nenhum pacote (o boletim usa só a biblioteca padrão), não
#     imprime a chave nem as variáveis de ambiente e entrega boletins/ como artifact;
#   - "commitar" é o único com contents: write, sem acesso ao secret: só roda git (sem pip
#     nem Python, com hooks desligados) e recusa mudanças fora de data/ e boletins/;
#   - "prazo" não tem permissão nenhuma nem faz checkout: só falha com o nome da fonte que
#     ainda não publicou o mês depois do dia 15.
name: Atualização mensal

on:
  schedule:
    - cron: "17 11 1-15 * *" # dias 1 a 15 de cada mês, 11h17 UTC (8h17 em Brasília)
  workflow_dispatch:
    inputs:
      boletim:
        description: "Gerar (ou refazer) o boletim do mês mais recente com IA"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    name: Ingestão, transform e testes
    # Só na main: o commit vai direto para ela.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      mes: ${{ steps.resultado.outputs.mes }}
      esperado: ${{ steps.checar.outputs.esperado }}
      atrasadas: ${{ steps.resultado.outputs.atrasadas }}
      prazo_vencido: ${{ steps.resultado.outputs.prazo_vencido }}
      mes_dados: ${{ steps.boletim.outputs.mes_dados }}
      boletim_pendente: ${{ steps.boletim.outputs.pendente }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        timeout-minutes: 10
        run: python -m pip install -r requirements.txt "pytest>=8"

      - name: Conferir se falta o mês anterior
        id: checar
        timeout-minutes: 5
        run: |
          esperado="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
          gravado="$(python -m src.ingest --ultimo-gravado)"
          echo "esperado=${esperado}" >> "$GITHUB_OUTPUT"
          echo "gravado=${gravado}" >> "$GITHUB_OUTPUT"
          echo "Mês esperado: ${esperado}. Último mês completo (gravado nas quatro séries): ${gravado:-nenhum}."
          python -m src.ingest --ultimo-gravado --por-serie
          if [[ -n "${gravado}" && ! "${gravado}" < "${esperado}" ]]; then
            echo "Dados já atualizados até ${gravado}: nada a baixar até o próximo mês." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "falta=false" >> "$GITHUB_OUTPUT"
          else
            echo "falta=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingestão incremental (Comex Stat, Pink Sheet e PTAX)
        if: steps.checar.outputs.falta == 'true'
        timeout-minutes: 30
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/ingest.log"
          falhou() {
            echo "::error title=Falha na ingestão::Uma das fontes (API do Comex Stat, Pink Sheet do Banco Mundial ou PTAX do BCB) falhou ou não devolveu algum mês já publicado (detalhes no log deste passo). Nada foi commitado; a próxima execução agendada tenta de novo."
            exit 1
          }
          # Pink Sheet (o arquivo inteiro, com as revisões listadas no log) e PTAX (só os meses
          # que faltam) primeiro. O Comex Stat vai só até o menor mês das duas: um mês do Comex
          # sem benchmark ou sem câmbio não chega ao dashboard nem ao boletim.
          python -m src.ingest --inicio 2015-01 --serie benchmark 2>&1 | tee -a "$log" || falhou
          python -m src.ingest --inicio 2015-01 --serie cambio 2>&1 | tee -a "$log" || falhou
          pink="$(python -m src.ingest --ultimo-gravado --serie benchmark)"
          ptax="$(python -m src.ingest --ultimo-gravado --serie cambio)"
          limite="${pink}"
          if [[ "${ptax}" < "${limite}" ]]; then limite="${ptax}"; fi
          if [[ ! "${limite}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error title=Sem Pink Sheet ou PTAX::Não há mês gravado na Pink Sheet (${pink:-nenhum}) ou na PTAX (${ptax:-nenhum}); o Comex Stat não foi baixado."
            exit 1
          fi
          echo "Comex Stat até ${limite} (Pink Sheet até ${pink}, PTAX até ${ptax})." | tee -a "$log"
          python -m src.ingest --inicio 2015-01 --fim "${limite}" --serie fertilizantes 2>&1 | tee -a "$log" || falhou
          python -m src.ingest --inicio 2015-01 --fim "${limite}" --serie soja 2>&1 | tee -a "$log" || falhou

      - name: Transform e testes
        if: steps.checar.outputs.falta == 'true'
        timeout-minutes: 10
        run: |
          python -m src.transform
          python -m pytest -q

      - name: Separar o mês completo novo
        id: resultado
        if: steps.checar.outputs.falta == 'true'
        timeout-minutes: 5
        env:
          ANTES: ${{ steps.checar.outputs.gravado }}
          ESPERADO: ${{ steps.checar.outputs.esperado }}
        run: |
          # Séries que ainda não têm o mês esperado: a fonte não publicou ou atrasou.
          atrasadas=""
          while read -r serie mes; do
            if [[ "${mes}" == "-" || "${mes}" < "${ESPERADO}" ]]; then
              case "${serie}" in
                fertilizantes) nome="importação de fertilizantes (Comex Stat/MDIC)" ;;
                soja) nome="exportação de soja (Comex Stat/MDIC)" ;;
                benchmark) nome="Pink Sheet (Banco Mundial)" ;;
                cambio) nome="PTAX (BCB)" ;;
                *) nome="${serie}" ;;
              esac
              if [[ "${mes}" == "-" ]]; then
                atrasadas+="${atrasadas:+; }${nome}, sem nada gravado"
              else
                atrasadas+="${atrasadas:+; }${nome}, gravada até ${mes}"
              fi
            fi
          done < <(python -m src.ingest --ultimo-gravado --por-serie)
          depois="nova checagem amanhã"
          if [[ -n "${atrasadas}" ]]; then
            echo "atrasadas=${atrasadas}" >> "$GITHUB_OUTPUT"
            if (( $(date -u +%-d) >= 15 )); then
              echo "prazo_vencido=true" >> "$GITHUB_OUTPUT"
              depois="passou o dia 15: o job \"prazo\" fica vermelho"
            fi
          fi
          # Mês completo = o menor entre as quatro séries. Só ele decide se há o que commitar.
          mes="$(python -m src.ingest --ultimo-gravado)"
          if [[ -z "${mes}" || ( -n "${ANTES}" && ! "${mes}" > "${ANTES}" ) ]]; then
            echo "::notice title=Mês ${ESPERADO} incompleto::Falta ${ESPERADO} em: ${atrasadas:-nenhuma série}. Nada foi commitado; ${depois}."
            echo "Mês ${ESPERADO} incompleto. Falta em: ${atrasadas:-nenhuma série}. Nada foi commitado; ${depois}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mes=${mes}" >> "$GITHUB_OUTPUT"
          {
            echo "### Atualização ${mes}"
            echo
            echo '```text'
            grep -E "^(Resumo|  )" "$RUNNER_TEMP/ingest.log" || true
            echo '```'
            echo
            if [[ -n "${atrasadas}" ]]; then
              echo "Ainda falta ${ESPERADO} em: ${atrasadas}."
              echo
            fi
            echo "Fonte: Comex Stat/MDIC; Banco Mundial (Pink Sheet); BCB/PTAX."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir o boletim do último mês
        id: boletim
        timeout-minutes: 2
        run: |
          mes_dados="$(python -m src.ingest --ultimo-gravado)"
          echo "mes_dados=${mes_dados}" >> "$GITHUB_OUTPUT"
          if [[ -n "${mes_dados}" && ! -f "boletins/${mes_dados}.md" ]]; then
            echo "O boletim de ${mes_dados} ainda não existe." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pendente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Entregar data/ para o boletim e o commit
        if: steps.resultado.outputs.mes != ''
        uses: actions/upload-artifact@v7
        with:
          name: dados
          path: |
            data/raw
            data/raw_soja
            data/raw_benchmark
            data/raw_cambio
            data/processed
          if-no-files-found: error
          retention-days: 1

  gerar-boletim:
    name: Gerar o boletim com IA
    needs: atualizar
    # Mês novo nos dados, boletim do último mês ainda inexistente, ou pedido manual.
    if: >-
      github.ref == 'refs/heads/main' && (
        needs.atualizar.outputs.mes != '' ||
        needs.atualizar.outputs.boletim_pendente == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.boletim)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Único job com acesso ao secret ANTHROPIC_API_KEY (environment boletim-ia).
    environment: boletim-ia
    permissions:
      contents: read
    outputs:
      gerado: ${{ steps.gerar.outputs.gerado }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Receber data/ com o mês novo
        if: needs.atualizar.outputs.mes != ''
        uses: actions/download-artifact@v8
        with:
          name: dados
          path: data
      # Sem pip install: src/boletim.py e src/llm.py usam só a biblioteca padrão.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Gerar e validar o boletim
        id: gerar
        timeout-minutes: 8
        env:
          RADAR_LLM_PROVIDER: ${{ vars.RADAR_LLM_PROVIDER }}
          RADAR_LLM_MODEL: ${{ vars.RADAR_LLM_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REFAZER: ${{ github.event_name == 'workflow_dispatch' }}
          MES: ${{ needs.atualizar.outputs.mes || needs.atualizar.outputs.mes_dados }}
        run: |
          # Sem a chave (ex.: um fork que ainda não configurou o environment), o boletim é
          # pulado com aviso e os dados seguem sendo atualizados. Nada aqui imprime a chave.
          if [[ "${RADAR_LLM_PROVIDER:-anthropic}" == "anthropic" && -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "::warning title=Boletim não gerado::Falta o secret ANTHROPIC_API_KEY no environment boletim-ia (veja 'Use com a sua IA' no README)."
            exit 0
          fi
          # O boletim é do último mês completo (gravado nas quatro séries), o mesmo do commit.
          if [[ ! "${MES}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error title=Mês inválido::O job de atualização devolveu '${MES}'."
            exit 1
          fi
          args=(--mes "${MES}")
          if [[ "${REFAZER}" == "true" ]]; then
            args+=(--forcar)
          fi
          python -m src.boletim "${args[@]}"
          if [[ -n "$(git status --porcelain -- boletins)" ]]; then
            echo "gerado=true" >> "$GITHUB_OUTPUT"
            python -c "import json; d = json.load(open('boletins/latest.json', encoding='utf-8')); print('### ' + d['titulo'] + '\n\n' + d['lead'] + '\n\n' + d['rodape'] + ' Fonte: ' + d['fonte'] + '.\n\nProvedor: ' + d['provedor'] + ' · modelo: ' + d['modelo'])" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Entregar boletins/ para o commit
        if: steps.gerar.outputs.gerado == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: boletim
          path: boletins
          if-no-files-found: error
          retention-days: 1

  commitar:
    name: Commit dos dados e do boletim
    needs: [atualizar, gerar-boletim]
    # Roda mesmo se o boletim falhar ou for pulado: os dados do mês não ficam presos a ele.
    if: >-
      !cancelled() && needs.atualizar.result == 'success' && (
        needs.atualizar.outputs.mes != '' || needs.gerar-boletim.outputs.gerado == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Receber data/
        if: needs.atualizar.outputs.mes != ''
        uses: actions/download-artifact@v8
        with:
          name: dados
          path: data
      - name: Receber boletins/
        if: needs.gerar-boletim.outputs.gerado == 'true'
        uses: actions/download-artifact@v8
        with:
          name: boletim
          path: boletins
      - name: Commitar e enviar para a main
        id: push
        env:
          MES: ${{ needs.atualizar.outputs.mes || needs.atualizar.outputs.mes_dados }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${MES}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error title=Mês inválido::O job de atualização devolveu '${MES}'."
            exit 1
          fi
          fora="$(git status --porcelain | grep -vE '^.. (data/(raw|raw_soja|raw_benchmark|raw_cambio|processed)|boletins)/' || true)"
          if [[ -n "${fora}" ]]; then
            echo "::error title=Mudança fora de data/ e boletins/::${fora}"
            exit 1
          fi
          if [[ -f boletins/latest.json ]] && grep -qE '"mock": *true' boletins/latest.json; then
            echo "::error title=Boletim de exemplo::boletins/latest.json veio do modo --mock; nada foi commitado."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw data/raw_soja data/raw_benchmark data/raw_cambio data/processed boletins
          if git diff --cached --quiet; then
            echo "Nada mudou em data/ nem em boletins/; nada a commitar."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "chore(dados): atualização ${MES}"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          if ! GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
               GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
               git -c core.hooksPath=/dev/null push origin HEAD:main; then
            echo "::error title=Push recusado::A main mudou durante a atualização. Nada foi publicado; a próxima execução refaz a atualização."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Fonte que não publicou o mês até o dia 15: o run fica vermelho dizendo qual. Separado do
  # job "atualizar" para não travar o commit dos meses completos que já entraram.
  prazo:
    name: Prazo das fontes (dia 15)
    needs: atualizar
    if: ${{ !cancelled() && needs.atualizar.outputs.prazo_vencido == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fonte sem o mês esperado
        env:
          ESPERADO: ${{ needs.atualizar.outputs.esperado }}
          ATRASADAS: ${{ needs.atualizar.outputs.atrasadas }}
        run: |
          echo "::error title=Fonte sem o mês ${ESPERADO}::Passou o dia 15 e ainda falta ${ESPERADO} em: ${ATRASADAS}. Nenhum mês incompleto foi commitado. Confira se a fonte mudou de endereço ou de formato e, quando ela publicar, rode este workflow manualmente com a opção boletim desmarcada (o boletim do mês novo é gerado de qualquer jeito; marcada, ela refaz o boletim já publicado)."
          exit 1

  # Commits feitos com o GITHUB_TOKEN não disparam outros workflows, então o deploy do
  # dashboard é chamado daqui, com o commit que acabou de entrar na main.
  publicar:
    name: Publicar o dashboard
    needs: commitar
    if: ${{ !cancelled() && needs.commitar.result == 'success' && needs.commitar.outputs.sha != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.commitar.outputs.sha }}
