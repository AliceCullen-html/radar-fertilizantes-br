# Testes e varredura de segredos em todo push e pull request.
# Não usa nenhum segredo: o workflow só lê o repositório.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é a versão mínima do projeto (pandas 2); 3.13 roda com pandas 3.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt "pytest>=8"
      - name: Rodar os testes
        run: python -m pytest -q

  deno:
    name: Deno (Edge Function da lista de espera)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Deno numa versão fixa, baixado direto e conferido pelo sha256 do .sha256sum publicado
      # (sem action de terceiros). Para trocar: pegar o sha256 em
      # https://dl.deno.land/release/<versão>/deno-x86_64-unknown-linux-gnu.zip.sha256sum
      DENO_VERSION: v2.9.6
      DENO_SHA256: 394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Instalar o Deno
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deno.zip" "https://dl.deno.land/release/${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/deno"
          echo "$RUNNER_TEMP/deno" >> "$GITHUB_PATH"
      - name: Formatação, lint e tipos
        run: |
          deno --version
          deno fmt --check --line-width=120 supabase/functions
          deno lint supabase/functions
          deno check supabase/functions/lista-espera/index.ts
      - name: Testes (sem rede, sem variáveis de ambiente e sem disco)
        # sem nenhuma flag --allow: o Supabase e o Turnstile são falsos e nada sai do processo
        run: deno test supabase/functions

  gitleaks:
    name: gitleaks (todo o histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # Mesma versão do .pre-commit-config.yaml; o Go confere a integridade no sum.golang.org.
      - name: Instalar o gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Procurar segredos em todos os commits
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner .
