# Testes e varredura de segredos em todo push e pull request.
# Não usa nenhum segredo: o workflow só lê o repositório.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é a versão mínima do projeto (pandas 2); 3.13 roda com pandas 3.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt "pytest>=8"
      - name: Rodar os testes
        run: python -m pytest -q

  gitleaks:
    name: gitleaks (todo o histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # Mesma versão do .pre-commit-config.yaml; o Go confere a integridade no sum.golang.org.
      - name: Instalar o gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Procurar segredos em todos os commits
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner .
